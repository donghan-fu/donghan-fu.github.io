name: Update Google Scholar stats

on:
  schedule:
    # Run once per day at 03:15 UTC. Adjust as needed.
    - cron: "15 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Scholar data
        env:
          SCHOLAR_USER_ID: MIEcV3oAAAAJ
          # Optional: set SCRAPER_API_KEY as a repo secret to avoid rate limits.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python scripts/fetch_scholar.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/data/scholar-stats.json; then
            git add assets/data/scholar-stats.json
            git commit -m "chore: update Scholar stats"
            git push
          else
            echo "No changes to commit."
          fi
